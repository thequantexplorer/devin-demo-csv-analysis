name: Report check

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Data tests
        run: python -m unittest discover -s tests -v
      - name: Report check
        run: python scripts/check_reports.py
